# M5 acceptance against the real, pinned OvenMediaEngine (PLAN §8 M5). Local only: plain HTTP on
# localhost. Run with: pnpm --filter @survey-anything/extension exec playwright test -c ../../deploy/test
name: sa-m5

x-secrets: &secrets
  OME_ADMISSION_SECRET: m5_admission_secret_not_real
  OME_API_TOKEN: m5_ome_api_token_not_real
  FORWARD_AUTH_SECRET: m5_forward_auth_secret_not_real

services:
  backend:
    image: survey-anything/backend:local
    environment:
      <<: *secrets
      PUBLIC_BASE_URL: http://localhost:8089
      DATA_DIR: /data
      OME_ENABLED: "true"
      OME_PUBLIC_HOST: 127.0.0.1
      OME_SIGNALING_BASE: http://127.0.0.1:8090
      OME_LLHLS_BASE: http://127.0.0.1:8090
      OME_API_URL: http://ome:8081
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: alerts@m5.test
    volumes:
      - m5-backend-data:/data # named volume, as in production: survives the backend restart test
    ports:
      - "8088:8080" # test only: lets the runner create events and contacts

  ome:
    image: airensoft/ovenmediaengine:v0.21.0@sha256:172da9129d32093f3c92c426d385a318db38c7e70de0a3a685693e69614672a6
    environment:
      <<: *secrets
      OME_HOST_IP: 127.0.0.1
      OME_ADMISSION_URL: http://backend:8080/ome/admission
    volumes:
      - ../ome/Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
    ports:
      - "13333:3333" # test only: direct signaling, so admission is tested without Caddy in front
      - "3478:3478/tcp"
      - "10000:10000/tcp"
      - "10000-10003:10000-10003/udp"

  # Same OME, but its admission webhook points at a server that accepts and never answers.
  ome-hung:
    image: airensoft/ovenmediaengine:v0.21.0@sha256:172da9129d32093f3c92c426d385a318db38c7e70de0a3a685693e69614672a6
    environment:
      <<: *secrets
      OME_HOST_IP: 127.0.0.1
      OME_ADMISSION_URL: http://hang:9999/ome/admission
    volumes:
      - ../ome/Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
    ports:
      - "13334:3333"

  hang:
    image: node:24-alpine@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
    command: ["node", "-e", "require('net').createServer(() => {}).listen(9999)"]

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      <<: *secrets
      PUBLIC_HOST: http://localhost:8089
      LIVE_HOST: http://127.0.0.1:8090
      LIVE_CONNECT_SRC: http://127.0.0.1:8090 ws://127.0.0.1:8090
      ACME_EMAIL: test@m5.test
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../apps/viewer/dist:/srv/viewer:ro
    ports:
      - "8089:8089"
      - "8090:8090"

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "8025:8025"

volumes:
  m5-backend-data:
